<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="40" ry="40" fill="white"/>
  
  <!-- Green quadrant (top-left) -->
  <rect x="0" y="0" width="240" height="240" rx="40" ry="40" fill="#00A651"/>
  <rect x="20" y="20" width="180" height="180" rx="20" ry="20" fill="white"/>
  <circle cx="60" cy="60" r="30" fill="#00A651"/>
  <circle cx="160" cy="60" r="30" fill="#00A651"/>
  <circle cx="60" cy="160" r="30" fill="#00A651"/>
  <circle cx="160" cy="160" r="30" fill="#00A651"/>
  
  <!-- Yellow quadrant (top-right) -->
  <rect x="272" y="0" width="240" height="240" rx="40" ry="40" fill="#FFC107"/>
  <rect x="292" y="20" width="180" height="180" rx="20" ry="20" fill="white"/>
  <circle cx="332" cy="60" r="30" fill="#FFC107"/>
  <circle cx="432" cy="60" r="30" fill="#FFC107"/>
  <circle cx="332" cy="160" r="30" fill="#FFC107"/>
  <circle cx="432" cy="160" r="30" fill="#FFC107"/>
  
  <!-- Red quadrant (bottom-left) -->
  <rect x="0" y="272" width="240" height="240" rx="40" ry="40" fill="#F44336"/>
  <rect x="20" y="292" width="180" height="180" rx="20" ry="20" fill="white"/>
  <circle cx="60" cy="332" r="30" fill="#F44336"/>
  <circle cx="160" cy="332" r="30" fill="#F44336"/>
  <circle cx="60" cy="432" r="30" fill="#F44336"/>
  <circle cx="160" cy="432" r="30" fill="#F44336"/>
  
  <!-- Blue quadrant (bottom-right) -->
  <rect x="272" y="272" width="240" height="240" rx="40" ry="40" fill="#2196F3"/>
  <rect x="292" y="292" width="180" height="180" rx="20" ry="20" fill="white"/>
  <circle cx="332" cy="332" r="30" fill="#2196F3"/>
  <circle cx="432" cy="332" r="30" fill="#2196F3"/>
  <circle cx="332" cy="432" r="30" fill="#2196F3"/>
  <circle cx="432" cy="432" r="30" fill="#2196F3"/>
  
  <!-- Center paths -->
  <rect x="240" y="0" width="32" height="512" fill="white"/>
  <rect x="0" y="240" width="512" height="32" fill="white"/>
  
  <!-- Path grid lines and stars -->
  <!-- Horizontal path grid lines -->
  <line x1="0" y1="256" x2="512" y2="256" stroke="#ddd" stroke-width="1"/>
  <line x1="0" y1="288" x2="512" y2="288" stroke="#ddd" stroke-width="1"/>
  <line x1="0" y1="224" x2="512" y2="224" stroke="#ddd" stroke-width="1"/>
  <line x1="0" y1="192" x2="512" y2="192" stroke="#ddd" stroke-width="1"/>
  <line x1="0" y1="320" x2="512" y2="320" stroke="#ddd" stroke-width="1"/>
  
  <!-- Vertical path grid lines -->
  <line x1="256" y1="0" x2="256" y2="512" stroke="#ddd" stroke-width="1"/>
  <line x1="224" y1="0" x2="224" y2="512" stroke="#ddd" stroke-width="1"/>
  <line x1="288" y1="0" x2="288" y2="512" stroke="#ddd" stroke-width="1"/>
  <line x1="192" y1="0" x2="192" y2="512" stroke="#ddd" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="512" stroke="#ddd" stroke-width="1"/>
  
  <!-- Star markers -->
  <polygon points="120,240 130,225 145,220 130,215 120,200 110,215 95,220 110,225" fill="white"/>
  <polygon points="240,120 225,130 220,145 215,130 200,120 215,110 220,95 225,110" fill="white"/>
  <polygon points="392,240 382,225 367,220 382,215 392,200 402,215 417,220 402,225" fill="white"/>
  <polygon points="240,392 255,382 260,367 265,382 280,392 265,402 260,417 255,402" fill="white"/>
  
  <!-- 3D Dice in center -->
  <g transform="translate(256, 256)">
    <!-- 3D Dice body -->
    <ellipse cx="0" cy="30" rx="80" ry="20" fill="rgba(0,0,0,0.2)"/>
    <g transform="rotate(-15)">
      <!-- Main dice body -->
      <rect x="-60" y="-60" width="120" height="120" rx="20" ry="20" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
      
      <!-- Dice dots -->
      <circle cx="-30" cy="-30" r="10" fill="black"/>
      <circle cx="30" cy="-30" r="10" fill="black"/>
      <circle cx="-30" cy="0" r="10" fill="black"/>
      <circle cx="0" cy="0" r="10" fill="black"/>
      <circle cx="30" cy="0" r="10" fill="black"/>
      <circle cx="-30" cy="30" r="10" fill="black"/>
      <circle cx="30" cy="30" r="10" fill="black"/>
      
      <!-- Highlight for 3D effect -->
      <rect x="-60" y="-60" width="120" height="10" rx="5" ry="5" fill="white" opacity="0.3"/>
      <rect x="-60" y="-60" width="10" height="120" rx="5" ry="5" fill="white" opacity="0.3"/>
    </g>
  </g>
</svg>